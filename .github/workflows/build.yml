name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core + tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test tests/NotchWin.Core.Tests --configuration Release

  app:
    name: WinUI 3 app (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build src/NotchWin.App/NotchWin.App.csproj --configuration Release -p:Platform=x64
