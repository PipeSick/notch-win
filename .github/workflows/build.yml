name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core + tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # external/winmac: WinMac.Ipc, fijado a un commit (el canal con el host de WinMac)
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test tests/NotchWin.Core.Tests --configuration Release

  app:
    name: WinUI 3 app (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # external/winmac: WinMac.Ipc, fijado a un commit (el canal con el host de WinMac)
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test tests/NotchWin.Core.Tests --configuration Release
      - run: dotnet build src/NotchWin.App/NotchWin.App.csproj -c Release -p:Platform=x64
      - name: Publish (self-contained, x64)
        run: dotnet publish src/NotchWin.App/NotchWin.App.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: NotchWin-ci-${{ github.sha }}
          path: publish/
          retention-days: 14
